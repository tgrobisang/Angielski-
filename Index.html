<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mów po angielsku</title>
<style>
/* Układ: jedna kolumna, duże cele dotykowe, ekran lekcji z paskiem czasu na górze */
:root{
  --bg:#f2f5f6; --card:#ffffff; --ink:#14232b; --muted:#5b6b73; --line:#d5dee2;
  --accent:#0b6e8a; --accent-ink:#ffffff; --good:#1d8348; --bad:#c0392b; --warn:#b9770e;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f181c; --card:#18252b; --ink:#e6eef1; --muted:#93a5ad; --line:#2b3b42;
  --accent:#4cb8d6; --accent-ink:#06222b; --good:#4ccf84; --bad:#ff7b6b; --warn:#e5b04a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);min-height:100vh;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:.9rem}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;min-height:46px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button.ghost{background:transparent}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.lesson{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lesson .name{font-weight:600;overflow-wrap:anywhere}
.pair{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pair:first-child{border-top:0;padding-top:0}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
/* ekran ćwiczenia */
.timer{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timer>i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.prompt{font-size:1.45rem;line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.blanks{font-family:var(--mono);font-size:1.25rem;line-height:2.1;display:flex;flex-wrap:wrap;gap:4px 14px}
.w{white-space:nowrap}
.w.ok{color:var(--good);font-weight:700}
.w.miss{color:var(--bad);font-weight:700}
.status{min-height:1.6em;font-weight:600}
.status.good{color:var(--good)} .status.bad{color:var(--bad)}
.heard{color:var(--muted);font-size:.95rem;min-height:1.4em;overflow-wrap:anywhere}
.pill{font-size:.8rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.rep{color:var(--warn);border-color:var(--warn)}
.big{display:flex;gap:10px}.big>button{flex:1}
.score{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.note{border-left:4px solid var(--warn);padding:6px 10px;font-size:.9rem}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ======== Logika dopasowania (testowalna) ======== */
//LOGIC_START
var NUMS=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function norm(w){
  w=String(w).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9ąćęłńóśźż]/g,'');
  if(/^\d+$/.test(w)&&+w<=20)return NUMS[+w];
  return w;
}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){d[i]=[i];}
  for(j=1;j<=n;j++){d[0][j]=j;}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  return d[m][n];
}
function sameWord(t,s){
  if(t===s)return true;
  if(t.length>=5&&lev(t,s)<=1)return true;
  return false;
}
function splitWord(raw){
  var m=/^([^A-Za-z0-9ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]*)([\s\S]*?)([^A-Za-z0-9ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]*)$/.exec(raw);
  return {pre:m[1],core:m[2],suf:m[3]};
}
function targetWords(sentence){
  return sentence.trim().split(/\s+/).filter(Boolean).map(function(raw){
    var p=splitWord(raw);
    return {raw:raw,pre:p.pre,core:p.core,suf:p.suf,key:norm(raw)};
  });
}
/* zwraca tablicę true/false dla każdego słowa celu */
function matchWords(targets,spokenText){
  var spoken=spokenText.trim().split(/\s+/).filter(Boolean).map(norm).filter(Boolean);
  var used=spoken.map(function(){return false;});
  return targets.map(function(t){
    if(!t.key)return true;
    var best=-1,j;
    for(j=0;j<spoken.length;j++){if(!used[j]&&spoken[j]===t.key){best=j;break;}}
    if(best<0)for(j=0;j<spoken.length;j++){if(!used[j]&&sameWord(t.key,spoken[j])){best=j;break;}}
    if(best>=0){used[best]=true;return true;}
    return false;
  });
}
//LOGIC_END

/* ======== Dane ======== */
var KEY_L='mpa_lessons_v1',KEY_S='mpa_settings_v1';
function load(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var lessons=load(KEY_L,[]);
var settings=Object.assign({seconds:12,lang:'en-US',auto:true,speak:true,delay:3},load(KEY_S,{}));
function persist(){save(KEY_L,lessons);save(KEY_S,settings);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var $app=document.getElementById('app');
function fmt(n){return n===1?'zdanie':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'zdania':'zdań');}

/* ======== Tłumaczenie (MyMemory, bez klucza) ======== */
function decodeHtml(s){var t=document.createElement('textarea');t.innerHTML=s;return t.value;}
function translate(text,from,to){
  var url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'|'+to;
  return fetch(url).then(function(r){return r.json();}).then(function(j){
    var t=j&&j.responseData&&j.responseData.translatedText;
    if(!t||/QUERY LENGTH LIMIT|MYMEMORY WARNING/i.test(t))throw new Error('limit');
    return decodeHtml(t);
  });
}

/* ======== Widoki ======== */
var view={name:'home'};
function go(v){stopRun();view=v;render();window.scrollTo(0,0);}
function render(){
  if(view.name==='home')home();
  else if(view.name==='edit')edit();
  else if(view.name==='settings')settingsView();
  else if(view.name==='run')runView();
}

function home(){
  var h='<div class="top"><h1>Mów po angielsku</h1><button id="bSet" class="ghost" aria-label="Ustawienia">Ustawienia</button></div>';
  if(!lessons.length)h+='<div class="card"><p style="margin:0">Nie masz jeszcze lekcji. Utwórz pierwszą i dodaj do niej zdania.</p></div>';
  lessons.forEach(function(l){
    h+='<div class="card"><div class="lesson"><div><div class="name">'+esc(l.name)+'</div><div class="muted">'+l.items.length+' '+fmt(l.items.length)+'</div></div>'+
    '<div class="row"><button data-edit="'+l.id+'">Edytuj</button><button class="primary" data-run="'+l.id+'"'+(l.items.length?'':' disabled')+'>Start</button></div></div></div>';
  });
  h+='<div class="card"><h2>Nowa lekcja</h2><div class="row"><input id="nName" class="grow" placeholder="Nazwa lekcji, np. W restauracji" maxlength="60"><button id="bNew" class="primary">Utwórz</button></div></div>';
  $app.innerHTML=h;
  document.getElementById('bSet').onclick=function(){go({name:'settings'});};
  function mk(){var n=document.getElementById('nName').value.trim();if(!n)return;var l={id:uid(),name:n,items:[]};lessons.push(l);persist();go({name:'edit',id:l.id});}
  document.getElementById('bNew').onclick=mk;
  document.getElementById('nName').onkeydown=function(e){if(e.key==='Enter')mk();};
  [].forEach.call($app.querySelectorAll('[data-edit]'),function(b){b.onclick=function(){go({name:'edit',id:b.dataset.edit});};});
  [].forEach.call($app.querySelectorAll('[data-run]'),function(b){b.onclick=function(){go({name:'run',id:b.dataset.run});};});
}

function getLesson(id){return lessons.filter(function(l){return l.id===id;})[0];}
var draft=null; // przetłumaczone zdania czekające na zapis

function edit(){
  var l=getLesson(view.id);if(!l){go({name:'home'});return;}
  var h='<div class="top"><button id="bBack" class="ghost">← Lekcje</button><button id="bRun" class="primary"'+(l.items.length?'':' disabled')+'>Start</button></div>';
  h+='<div class="card"><label class="f">Nazwa lekcji<input id="eName" value="'+esc(l.name)+'" maxlength="60"></label></div>';
  h+='<div class="card"><h2>Dodaj zdania</h2><label class="f">Jedno zdanie w wierszu<textarea id="eText" placeholder="I would like a table for two.&#10;Could we see the menu, please?"></textarea></label>'+
     '<div class="row"><select id="eDir" class="grow"><option value="en|pl">Wpisuję po angielsku → tłumacz na polski</option><option value="pl|en">Wpisuję po polsku → tłumacz na angielski</option></select></div>'+
     '<button id="bTr" class="primary">Przetłumacz</button><div id="trMsg" class="muted"></div></div>';
  if(draft&&draft.lessonId===l.id){
    h+='<div class="card"><h2>Sprawdź i zapisz</h2><div class="muted">Możesz poprawić tłumaczenie przed zapisem.</div>';
    draft.rows.forEach(function(r,i){
      h+='<div class="pair"><label class="f">Polski<input data-d="pl" data-i="'+i+'" value="'+esc(r.pl)+'"></label><label class="f">Angielski<input data-d="en" data-i="'+i+'" value="'+esc(r.en)+'"></label></div>';
    });
    h+='<div class="big"><button id="bDisc">Odrzuć</button><button id="bSave" class="primary">Zapisz w lekcji</button></div></div>';
  }
  h+='<div class="card"><h2>Zdania w lekcji ('+l.items.length+')</h2>';
  if(!l.items.length)h+='<div class="muted">Brak zdań.</div>';
  l.items.forEach(function(it,i){
    h+='<div class="pair"><label class="f">Polski<input data-p="pl" data-i="'+i+'" value="'+esc(it.pl)+'"></label><label class="f">Angielski<input data-p="en" data-i="'+i+'" value="'+esc(it.en)+'"></label><div><button class="danger" data-del="'+i+'">Usuń</button></div></div>';
  });
  h+='</div><div class="card"><button class="danger" id="bDelL">Usuń całą lekcję</button></div>';
  $app.innerHTML=h;
  document.getElementById('bBack').onclick=function(){go({name:'home'});};
  document.getElementById('bRun').onclick=function(){go({name:'run',id:l.id});};
  document.getElementById('eName').onchange=function(e){var v=e.target.value.trim();if(v){l.name=v;persist();}};
  [].forEach.call($app.querySelectorAll('[data-p]'),function(inp){inp.onchange=function(){l.items[+inp.dataset.i][inp.dataset.p]=inp.value.trim();persist();};});
  [].forEach.call($app.querySelectorAll('[data-del]'),function(b){b.onclick=function(){l.items.splice(+b.dataset.del,1);persist();edit();};});
  document.getElementById('bDelL').onclick=function(){
    var b=document.getElementById('bDelL');
    if(b.dataset.sure){lessons=lessons.filter(function(x){return x.id!==l.id;});persist();go({name:'home'});}
    else{b.dataset.sure='1';b.textContent='Dotknij ponownie, aby usunąć';}
  };
  document.getElementById('bTr').onclick=doTranslate;
  if(draft&&draft.lessonId===l.id){
    [].forEach.call($app.querySelectorAll('[data-d]'),function(inp){inp.oninput=function(){draft.rows[+inp.dataset.i][inp.dataset.d]=inp.value;};});
    document.getElementById('bDisc').onclick=function(){draft=null;edit();};
    document.getElementById('bSave').onclick=function(){
      draft.rows.forEach(function(r){if(r.pl.trim()&&r.en.trim())l.items.push({pl:r.pl.trim(),en:r.en.trim()});});
      draft=null;persist();edit();
    };
  }
}

function doTranslate(){
  var l=getLesson(view.id);
  var lines=document.getElementById('eText').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  var dir=document.getElementById('eDir').value.split('|');
  var msg=document.getElementById('trMsg');
  if(!lines.length){msg.textContent='Wpisz co najmniej jedno zdanie.';return;}
  var btn=document.getElementById('bTr');btn.disabled=true;
  var rows=[],failed=0,idx=0;
  function next(){
    if(idx>=lines.length){
      btn.disabled=false;
      draft={lessonId:l.id,rows:rows};
      edit();
      if(failed){var m=document.getElementById('trMsg');if(m)m.textContent='Nie udało się przetłumaczyć '+failed+' '+fmt(failed)+' (brak internetu lub limit). Uzupełnij je ręcznie.';}
      return;
    }
    msg.textContent='Tłumaczę '+(idx+1)+' z '+lines.length+'…';
    var src=lines[idx];
    translate(src,dir[0],dir[1]).then(function(t){return t;},function(){failed++;return '';}).then(function(t){
      rows.push(dir[0]==='en'?{en:src,pl:t}:{pl:src,en:t});idx++;next();
    });
  }
  next();
}

function settingsView(){
  var h='<div class="top"><button id="bBack" class="ghost">← Lekcje</button></div><h1>Ustawienia</h1>';
  h+='<div class="card"><label class="f">Czas na odpowiedź (sekundy)<input id="sSec" type="number" min="3" max="60" step="1" inputmode="numeric" value="'+settings.seconds+'"></label>'+
     '<label class="f">Język rozpoznawania mowy<select id="sLang"><option value="en-US">Angielski (USA)</option><option value="en-GB">Angielski (Wielka Brytania)</option></select></label>'+
     '<label class="row"><input id="sAuto" type="checkbox" style="width:22px;min-height:22px"> Automatycznie przechodź do następnego zdania</label>'+
     '<label class="f">Pauza przed następnym zdaniem (sekundy)<input id="sDelay" type="number" min="1" max="15" inputmode="numeric" value="'+settings.delay+'"></label>'+
     '<label class="row"><input id="sSpeak" type="checkbox" style="width:22px;min-height:22px"> Odczytaj poprawną odpowiedź na głos</label></div>';
  $app.innerHTML=h;
  document.getElementById('sLang').value=settings.lang;
  document.getElementById('sAuto').checked=settings.auto;
  document.getElementById('sSpeak').checked=settings.speak;
  document.getElementById('bBack').onclick=function(){go({name:'home'});};
  function bind(id,fn){document.getElementById(id).onchange=function(e){fn(e.target);persist();};}
  bind('sSec',function(t){settings.seconds=Math.max(3,Math.min(60,parseInt(t.value,10)||12));t.value=settings.seconds;});
  bind('sDelay',function(t){settings.delay=Math.max(1,Math.min(15,parseInt(t.value,10)||3));t.value=settings.delay;});
  bind('sLang',function(t){settings.lang=t.value;});
  bind('sAuto',function(t){settings.auto=t.checked;});
  bind('sSpeak',function(t){settings.speak=t.checked;});
}

/* ======== Ćwiczenie ======== */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var run=null;
function stopRun(){
  if(!run)return;
  run.dead=true;
  clearInterval(run.tick);clearTimeout(run.nextT);
  try{if(run.rec)run.rec.abort();}catch(e){}
  try{speechSynthesis.cancel();}catch(e){}
  run=null;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function runView(){
  var l=getLesson(view.id);if(!l){go({name:'home'});return;}
  run={lesson:l,queue:l.items.slice(),wrong:[],round:1,pos:0,right:0,total:l.items.length,phase:'idle',spoken:'',dead:false,answered:0};
  showItem();
}

function showItem(){
  if(!run||run.dead)return;
  if(run.pos>=run.queue.length){
    if(run.wrong.length){run.queue=run.wrong;run.wrong=[];run.pos=0;run.round++;}
    else{return finish();}
  }
  var it=run.queue[run.pos];
  run.item=it;run.targets=targetWords(it.en);run.spoken='';run.phase='ready';run.matched=run.targets.map(function(){return false;});
  var h='<div class="top"><button id="bExit" class="ghost">← Zakończ</button><span class="pill'+(run.round>1?' rep':'')+'">'+(run.round>1?'Powtórka '+(run.round-1)+' · ':'')+(run.pos+1)+' / '+run.queue.length+'</span></div>'+
    '<div class="card"><div class="timer" aria-hidden="true"><i id="tBar"></i></div>'+
    '<div class="prompt">'+esc(it.pl)+'</div><div id="blanks" class="blanks" aria-label="Szukane słowa"></div>'+
    '<div id="status" class="status"></div><div id="heard" class="heard"></div>'+
    '<div id="ctl" class="big"></div></div>';
  if(!SR)h+='<div class="note">Ta przeglądarka nie obsługuje rozpoznawania mowy. Użyj Chrome na Androidzie lub wpisuj odpowiedzi ręcznie.</div>';
  $app.innerHTML=h;
  document.getElementById('bExit').onclick=function(){go({name:'home'});};
  drawBlanks(false);
  controls('ready');
  if(SR&&(run.autoStarted||run.pos>0||run.round>1)){startListening();}
  else if(SR){/* pierwsze zdanie czeka na dotknięcie (wymóg przeglądarki) */}
}

function drawBlanks(reveal){
  var h='';
  run.targets.forEach(function(t,i){
    var cls='w',txt;
    if(run.matched[i]){cls+=' ok';txt=esc(t.pre+t.core+t.suf);}
    else if(reveal){cls+=' miss';txt=esc(t.pre+t.core+t.suf);}
    else{txt=esc(t.pre)+new Array(Math.max(1,t.core.length)+1).join('_')+esc(t.suf);}
    h+='<span class="'+cls+'">'+txt+'</span>';
  });
  document.getElementById('blanks').innerHTML=h;
}

function controls(state){
  var c=document.getElementById('ctl');if(!c)return;
  if(state==='ready'){
    c.innerHTML=SR?'<button id="bGo" class="primary">Mów (włącz mikrofon)</button><button id="bSkip">Pomiń</button>':
      '<input id="typed" placeholder="Wpisz po angielsku" autocomplete="off" autocapitalize="off"><button id="bCheck" class="primary">Sprawdź</button>';
    var g=document.getElementById('bGo');if(g)g.onclick=function(){run.autoStarted=true;startListening();};
    var s=document.getElementById('bSkip');if(s)s.onclick=function(){finishItem(false,true);};
    var ch=document.getElementById('bCheck');if(ch)ch.onclick=function(){run.spoken=document.getElementById('typed').value;evaluate();finishItem(allMatched(),false);};
    var ty=document.getElementById('typed');if(ty)ty.onkeydown=function(e){if(e.key==='Enter')ch.click();};
  }else if(state==='listening'){
    c.innerHTML='<button id="bDone" class="primary">Gotowe</button><button id="bSkip">Pomiń</button>';
    document.getElementById('bDone').onclick=function(){endListening();};
    document.getElementById('bSkip').onclick=function(){abortListening();finishItem(false,true);};
  }else if(state==='result'){
    c.innerHTML='<button id="bNext" class="primary">Dalej</button>';
    document.getElementById('bNext').onclick=function(){clearTimeout(run.nextT);advance();};
  }
}

function allMatched(){return run.matched.every(Boolean);}
function evaluate(){
  var m=matchWords(run.targets,run.spoken);
  run.matched=run.matched.map(function(v,i){return v||m[i];});
  drawBlanks(false);
}

function startListening(){
  if(!run||run.dead||run.phase==='listening'||run.phase==='result')return;
  var r=run,rec=new SR();
  rec.lang=settings.lang;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
  r.rec=rec;r.phase='listening';r.finalText='';r.restarts=0;
  rec.onresult=function(ev){
    if(r.dead||r.rec!==rec)return;
    var fin='',interim='';
    for(var i=0;i<ev.results.length;i++){
      if(ev.results[i].isFinal)fin+=ev.results[i][0].transcript+' ';else interim+=ev.results[i][0].transcript+' ';
    }
    r.spoken=fin+interim;
    var h=document.getElementById('heard');if(h)h.textContent='Słyszę: '+r.spoken.trim();
    evaluate();
    if(allMatched())endListening();
  };
  rec.onerror=function(ev){
    if(r.dead||r.rec!==rec)return;
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){
      r.fatal=true;
      var s=document.getElementById('status');if(s){s.className='status bad';s.textContent='Brak zgody na mikrofon. Zezwól na dostęp w ustawieniach przeglądarki.';}
    }
  };
  rec.onend=function(){
    if(r.dead||r.rec!==rec||r.phase!=='listening')return;
    if(r.fatal){abortListening();controls('ready');return;}
    if(r.remaining>0.4&&r.restarts<6){r.restarts++;try{var n=new SR();n.lang=rec.lang;n.continuous=true;n.interimResults=true;n.onresult=rec.onresult;n.onerror=rec.onerror;n.onend=rec.onend;r.rec=n;rec=n;n.start();}catch(e){}}
  };
  try{rec.start();}catch(e){r.phase='ready';controls('ready');return;}
  var s=document.getElementById('status');if(s){s.className='status';s.textContent='Mów po angielsku…';}
  controls('listening');
  var total=settings.seconds*1000,t0=Date.now();
  r.remaining=settings.seconds;
  clearInterval(r.tick);
  r.tick=setInterval(function(){
    if(r.dead)return;
    var left=Math.max(0,total-(Date.now()-t0));
    r.remaining=left/1000;
    var bar=document.getElementById('tBar');if(bar)bar.style.transform='scaleX('+(left/total)+')';
    if(left<=0)endListening();
  },100);
}
function abortListening(){
  if(!run)return;clearInterval(run.tick);
  try{if(run.rec)run.rec.abort();}catch(e){}
  run.phase='ready';
}
function endListening(){
  if(!run||run.phase!=='listening')return;
  var r=run;clearInterval(r.tick);r.phase='finishing';
  try{r.rec.stop();}catch(e){}
  setTimeout(function(){ // chwila na ostatni wynik rozpoznawania
    if(!run||run!==r||r.dead)return;
    evaluate();finishItem(allMatched(),false);
  },450);
}

function say(text){
  if(!settings.speak)return;
  try{var u=new SpeechSynthesisUtterance(text);u.lang=settings.lang;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}

function finishItem(ok,skipped){
  if(!run||run.dead)return;
  var r=run;clearInterval(r.tick);r.phase='result';
  var bar=document.getElementById('tBar');if(bar)bar.style.transform='scaleX(0)';
  var s=document.getElementById('status');
  if(ok){if(r.round===1)r.right++;s.className='status good';s.textContent='Dobrze!';}
  else{r.wrong.push(r.item);s.className='status bad';s.textContent=skipped?'Pominięte — wróci w powtórce.':'Nie tym razem — wróci w powtórce.';}
  drawBlanks(true);
  say(r.item.en);
  controls('result');
  if(settings.auto){r.nextT=setTimeout(advance,(ok?settings.delay:settings.delay+2)*1000);}
}
function advance(){if(!run||run.dead)return;try{speechSynthesis.cancel();}catch(e){}run.pos++;showItem();}

function finish(){
  var r=run,l=r.lesson;run.dead=true;
  var pct=r.total?Math.round(r.right/r.total*100):0;
  $app.innerHTML='<div class="top"><h1>Koniec lekcji</h1></div><div class="card"><div class="muted">'+esc(l.name)+'</div><div class="score">'+pct+'%</div>'+
   '<div>Za pierwszym razem poprawnie: '+r.right+' z '+r.total+'. Rund powtórek: '+Math.max(0,r.round-1)+'.</div></div>'+
   '<div class="big"><button id="bHome">Lekcje</button><button id="bAgain" class="primary">Jeszcze raz</button></div>';
  document.getElementById('bHome').onclick=function(){go({name:'home'});};
  document.getElementById('bAgain').onclick=function(){go({name:'run',id:l.id});};
  run=null;
}

/* stan wyniku "za pierwszym razem": zdania z powtórek nie zwiększają r.right (patrz finishItem) */
render();
</script>
